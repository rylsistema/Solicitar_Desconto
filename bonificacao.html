<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solicitação de Bonificação</title>

  <style>
    :root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --muted: #6b7280;
  --text: #1f2937;
  --line: #d9dee7;
  --accent: #4f8cff;
    }

    * { box-sizing: border-box; }

    body {
      margin:0;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .title {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    h1 {
      margin:0;
      font-size:24px;
    }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

    .grid {
      display:grid;
      grid-template-columns: repeat(12,1fr);
      gap:12px;
    }
    .info-flex {
  grid-column: span 3;
}

.info-codcliente {
  grid-column: span 3;
}

.info-nomecliente {
  grid-column: span 6;
}

.info-codrca {
  grid-column: span 3;
}

.info-nomerca {
  grid-column: span 9;
}

    .field {
      grid-column: span 12;
    }

@media (min-width:820px){

  .span-2  { grid-column: span 2; }
  .span-3  { grid-column: span 3; }
  .span-4  { grid-column: span 4; }
  .span-5  { grid-column: span 5; }
  .span-6  { grid-column: span 6; }
  .span-7  { grid-column: span 7; }
  .span-8  { grid-column: span 8; }
  .span-9  { grid-column: span 9; }
  .span-10 { grid-column: span 10; }
  .span-12 { grid-column: span 12; }

    .info-flex {
    grid-column: span 3;
  }

  .info-codcliente {
    grid-column: span 3;
  }

  .info-nomecliente {
    grid-column: span 6;
  }

  .info-codrca {
    grid-column: span 3;
  }

  .info-nomerca {
    grid-column: span 9;
  }

}

    label {
      display:block;
      font-size:12px;
      color: var(--muted);
      margin:0 0 6px 2px;
    }

    input, textarea {
      width:100%;
      background:#ffffff;
      border:1px solid var(--line);
      color:var(--text);
      border-radius:12px;
      padding:11px 12px;
      outline:none;
      font-size:14px;
    }

    textarea {
      min-height:160px;
      resize:vertical;
    }

    .obs {
  min-height:42px;
  height:42px;
}

   input[readonly],
textarea[readonly] {
  background:#f3f4f6;
  color:#374151;
}

    .radioRow {
  display:flex;
  align-items:center;
  gap:18px;
  height:42px;
  padding:0 12px;
  border-radius:12px;
  background:#ffffff;
  border:1px solid var(--line);
}

   .radioRow label {
  display:flex;
  align-items:center;
  gap:6px;
  margin:0;
  white-space:nowrap;
  color:var(--text);
  font-size:14px;
}

   .radioRow input {
  width:auto;
  margin:0;
}

    .produto {
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      margin-top:18px;
      background: #f8f9fb;
    }

    .produtoCabecalho {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:16px;
    }

    .produtoTitulo {
      font-size:15px;
      font-weight:700;
      color:#1f2937;
      margin:0;
    }
    
    .btnRemover {
      padding:8px 12px;
      font-size:12px;
        }

        .btnVoltar {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#ffffff;
  color:#1f2937;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}

.btnVoltar:hover {
  background:#f1f5f9;
}

    .actions {
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:18px;
      flex-wrap:wrap;
    }

    button {
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
    }

    button.primary {
      background: rgba(79,140,255,.18);
      border-color: rgba(79,140,255,.55);
    }

    button.success {
      background: rgba(57,214,156,.12);
      border-color: rgba(57,214,156,.45);
    }

    .toast {
      position:fixed;
      right:16px;
      bottom:16px;
      background:#0f1830;
      border:1px solid var(--line);
      padding:10px 12px;
      border-radius:12px;
      opacity:0;
      transition:.2s;
    }

    .toast.show {
      opacity:1;
    }

.upper {
  text-transform: uppercase;
}
  </style>
</head>

<body>

<div class="wrap">

  <div class="title">
  <h1>Solicitação de Bonificação</h1>

  <a href="index.html" class="btnVoltar">
    ← Solicitação de Desconto
  </a>
</div>

  <div class="card">

    <form id="form">

      <div class="grid">

        <div class="field info-flex">
  <label>Bnf no Flex?</label>

  <div class="radioRow">
    <label>
      <input type="radio" name="tipoDesconto" value="Sim" checked>
      Sim
    </label>

    <label>
      <input type="radio" name="tipoDesconto" value="Não">
      Não
    </label>
  </div>
</div>

<div class="field info-codcliente">
  <label>Código do Cliente</label>
  <input id="codCliente" type="text">
</div>

<div class="field info-nomecliente">
  <label>Nome do Cliente</label>
  <input id="nomeCliente" class="upper" type="text" readonly>
</div>

<div class="field info-codrca">
  <label>Código do RCA</label>
  <input id="codRca" type="text">
</div>

<div class="field info-nomerca">
  <label>Nome do RCA</label>
  <input id="nomeRca" class="upper" type="text" readonly>
</div>

    <div class="field span-12">
  <label>Motivo da Bonificação</label>
  <textarea
      id="motivo"
      class="upper obs"
      rows="1"
      placeholder="Digite o motivo da bonificação..."></textarea>
</div>
      </div>
      
      <div id="produtosContainer">

        <div class="produto">

        <div class="produtoCabecalho">  

          <div class="produtoTitulo">Produto</div>

  <button
    type="button"
    class="btnRemover"
    onclick="removerProduto(this)">
    ❌ Remover Produto
  </button>
        </div>

          <div class="grid">

            <div class="field span-3">
              <label>Código do Produto</label>
              <input class="codProduto" type="text">
            </div>

            <div class="field span-9">
              <label>Nome do Produto</label>
              <input class="nomeProduto upper" type="text" readonly>
            </div>

            <div class="field span-2">
    <label>Quantidade</label>
    <input class="qtd" type="number">
</div>

<div class="field span-3">
    <label>Preço Unitário</label>
    <input class="precoTabela" type="text" value="R$ 0,00">
</div>

<div class="field span-3">
    <label>Valor Total</label>
    <input class="valorTotal" type="text" readonly value="R$ 0,00">
</div>
          </div>

        </div>

      </div>

      <div class="actions">
        <button type="button" onclick="adicionarProduto()">
          + Adicionar produto
        </button>
      </div>

      <div class="grid">

        <div class="field span-6">
          <label>Total Bonificação</label>
          <input id="totalPedido" readonly value="R$ 0,00">
        </div>

        <div class="field span-12">
          <label>Texto formatado (prévia)</label>
          <textarea id="whatsPreview" readonly></textarea>
        </div>

      </div>

      <div class="actions">
        <button type="button" id="limpar">Limpar</button>
        <button type="button" class="success" id="copiar">Copiar</button>
        <button type="button" class="primary" onclick="window.print()">
          Imprimir
        </button>
      </div>

    </form>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

let baseProdutos = [];
let baseClientes = [];
let baseRcas = [];

async function carregarBases(){

  const respostaProdutos =
    await fetch('produtos.json');

  baseProdutos =
    await respostaProdutos.json();

  const respostaClientes =
    await fetch('clientes.json');

  baseClientes =
    await respostaClientes.json();

  const respostaRcas =
    await fetch('rcas.json');

  baseRcas =
    await respostaRcas.json();

  console.log('Produtos carregados:', baseProdutos);
  console.log('Clientes carregados:', baseClientes);
  console.log('RCAs carregados:', baseRcas);

}

const brl = new Intl.NumberFormat('pt-BR', {
  style:'currency',
  currency:'BRL'
});

function formatBRL(v){
  return brl.format(Number(v || 0));
}

function parseBRNumber(str){

  if(!str) return 0;

  const s = String(str)
    .replace(/R\$/g,'')
    .replace(/\./g,'')
    .replace(',','.')
    .replace('%','')
    .trim();

  return Number(s) || 0;
}

function clamp(n,a,b){
  return Math.min(Math.max(n,a),b);
}

function showToast(msg){

  const t = document.getElementById('toast');

  t.textContent = msg;

  t.classList.add('show');

  setTimeout(()=>{
    t.classList.remove('show');
  },1800);
}

function adicionarProduto(){

  const original =
    document.querySelector('.produto');

  const clone =
    original.cloneNode(true);

  clone.querySelector('.codProduto').value = '';
  clone.querySelector('.nomeProduto').value = '';
  clone.querySelector('.qtd').value = '';
  clone.querySelector('.precoTabela').value = 'R$ 0,00';
  clone.querySelector('.valorTotal').value = 'R$ 0,00';

  document
    .getElementById('produtosContainer')
    .appendChild(clone);

  clone.querySelector('.codProduto').focus();
}

function removerProduto(botao){

  const produtos = document.querySelectorAll('.produto');

  if(produtos.length <= 1){
    showToast('É necessário manter pelo menos 1 produto');
    return;
  }

  const produto = botao.closest('.produto');

  produto.remove();

  recalc();
}

function recalc(){

  let totalBonificacao = 0;

  const produtos =
    document.querySelectorAll('.produto');

  produtos.forEach(produto => {

    const qtd =
      parseBRNumber(
        produto.querySelector('.qtd').value
      );

    const precoUnitario =
      parseBRNumber(
        produto.querySelector('.precoTabela').value
      );

    const valorTotal =
      qtd * precoUnitario;

    totalBonificacao += valorTotal;

    produto.querySelector('.valorTotal').value =
      formatBRL(valorTotal);

  });

  document.getElementById('totalPedido').value =
    formatBRL(totalBonificacao);

  buildWhatsText();

}

function buildWhatsText(){

  const lines = [];

  const tipoFlex =
    document.querySelector(
      'input[name="tipoDesconto"]:checked'
    ).value;

  const hoje = new Date();

  const dataAtual =
    hoje.toLocaleDateString('pt-BR');

  lines.push('🟡 *SOLICITAÇÃO DE BONIFICAÇÃO*');
  lines.push(`Data: ${dataAtual}`);
  lines.push('');

  lines.push(`• *Bnf no Flex?:* ${tipoFlex}`);

  const codRca =
    document.getElementById('codRca').value;

  const nomeRca =
    document.getElementById('nomeRca').value;

  if(codRca || nomeRca){
    lines.push(
      `• *RCA:* ${codRca} - ${nomeRca}`
    );
  }

  const codCliente =
    document.getElementById('codCliente').value;

  const nomeCliente =
    document.getElementById('nomeCliente').value;

  if(codCliente || nomeCliente){
    lines.push(
      `• *Cliente:* ${codCliente} - ${nomeCliente}`
    );
  }

  const motivo =
    document.getElementById('motivo').value.trim();

  if(motivo){
    lines.push('');
    lines.push('*MOTIVO DA BONIFICAÇÃO:*');
    lines.push(motivo);
  }

  lines.push('');
  lines.push('*TOTAL BONIFICAÇÃO*');
  lines.push(
    document.getElementById('totalPedido').value
  );

  lines.push('');
  lines.push('*PRODUTOS*');

  const produtos =
    document.querySelectorAll('.produto');

  produtos.forEach(p => {

    const cod =
      p.querySelector('.codProduto').value || '';

    const nome =
      p.querySelector('.nomeProduto').value || '';

    const qtd =
      parseBRNumber(
        p.querySelector('.qtd').value
      );

    const preco =
      parseBRNumber(
        p.querySelector('.precoTabela').value
      );

    const valorTotal =
      qtd * preco;

    lines.push('');
    lines.push(`*${cod} - ${nome}*`);
    lines.push(`Quantidade: ${qtd}`);
    lines.push(`Preço Item: ${formatBRL(preco)}`);
    lines.push(
      `VALOR TT: ${formatBRL(valorTotal)}`
    );

  });

  document.getElementById('whatsPreview').value =
    lines.join('\n');
}

async function copyToClipboard(text){

  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
    return;
  }

  const ta = document.createElement('textarea');

  ta.value = text;

  document.body.appendChild(ta);

  ta.select();

  document.execCommand('copy');

  document.body.removeChild(ta);
}

document.addEventListener('input', function(e){

  // QUANTIDADE E PREÇO
  if(
    e.target.classList.contains('qtd') ||
    e.target.classList.contains('precoTabela')
  ){
    recalc();
  }


  // BUSCA PRODUTO
  if(e.target.classList.contains('codProduto')){

    console.log('BUSCA PRODUTO ATIVADA');

    const codigo =
      e.target.value.trim();

    const bloco =
      e.target.closest('.produto');

    const produto =
      baseProdutos.find(
        p => String(p.codigo).trim() === codigo
      );

    if(produto){

      bloco.querySelector('.nomeProduto').value =
        produto.nome;

    } else {

      bloco.querySelector('.nomeProduto').value = '';

    }

  }


  // BUSCA CLIENTE
  if(e.target.id === 'codCliente'){

    const codigo =
      e.target.value.trim();

    const cliente =
      baseClientes.find(
        c => String(c.codigo).trim() === codigo
      );

    if(cliente){

      document.getElementById('nomeCliente').value =
        cliente.nome;

    } else {

      document.getElementById('nomeCliente').value = '';

    }

  }


  // BUSCA RCA
  if(e.target.id === 'codRca'){

    const codigo =
      e.target.value.trim();

    const rca =
      baseRcas.find(
        r => String(r.codigo).trim() === codigo
      );

    if(rca){

      document.getElementById('nomeRca').value =
        rca.nome;

    } else {

      document.getElementById('nomeRca').value = '';

    }

  }

});

document.addEventListener('blur', function(e){

   if(e.target.classList.contains('precoTabela')){
    e.target.value =
      formatBRL(parseBRNumber(e.target.value));
  }

  recalc();

}, true);

// ===== Seleciona automaticamente o conteúdo ao receber foco =====

document.addEventListener('focus', function(e){

  if(
    e.target.id === 'codCliente' ||
    e.target.id === 'codRca' ||
    e.target.classList.contains('codProduto') ||
    e.target.classList.contains('qtd') ||
    e.target.classList.contains('precoTabela')
      ){

    if(e.target.value.trim() !== ''){

      setTimeout(() => {
        e.target.select();
      }, 0);

    }

  }

}, true);

document.getElementById('copiar').addEventListener('click', async ()=>{

  try {

    await copyToClipboard(
      document.getElementById('whatsPreview').value
    );

    showToast('Texto copiado!');

  } catch(e){

    showToast('Erro ao copiar');
  }

});

document.getElementById('limpar').addEventListener('click', ()=>{
  location.reload();
});

carregarBases();

recalc();

</script>

</body>
</html>
